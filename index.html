<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日语句子分段 & 假名标注</title>
<style>
body { font-family: "Noto Sans JP", sans-serif; background:#fafafa; margin:0; padding:1rem; display:flex; flex-direction:column; align-items:center;}
main { width:90%; max-width:600px; background:white; border-radius:12px; box-shadow:0 0 10px rgba(0,0,0,0.1); padding:20px; }
textarea { width:100%; font-size:1rem; margin-top:1rem; padding:10px; resize:vertical; }
button { margin-top:1rem; background:#0078d7; color:white; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; }
button:hover { background:#005fa3; }
#output { margin-top:1rem; padding:10px; background:#f4f4f4; border-radius:6px; white-space:pre-wrap; }
ruby rt { font-size:0.6em; }
</style>
</head>
<body>
<main>
  <h1>日语句子分段 & 假名标注工具</h1>
  <textarea id="input" rows="5" placeholder="输入日语句子..."></textarea>
  <button id="process">处理</button>
  <div id="output"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dist/kuromoji.js"></script>
<script>
kuromoji.builder({ dicPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dist/dict/' }).build((err, tokenizer) => {
  if (err) { console.error(err); return; }

  const button = document.getElementById("process");
  button.addEventListener("click", () => {
    const text = document.getElementById("input").value.trim();
    if (!text) return;

    // 按句号、问号、感叹号分段
    const sentences = text.split(/(?<=[。！？!?])/u).map(s => s.trim()).filter(Boolean);

    const annotated = sentences.map(sentence => {
      const tokens = tokenizer.tokenize(sentence);
      // tokens 每个包含 surface_form（原文）、reading（假名）
      return tokens.map(token => {
        const reading = token.reading || token.surface_form;
        return `<ruby><rb>${token.surface_form}</rb><rt>${reading}</rt></ruby>`;
      }).join('');
    });

    document.getElementById("output").innerHTML = annotated.join('<br>');
  });
});
</script>
</body>
</html>
